#Directories 
working_dir: /mtDNA_variant_call_pipeline #absolute path for working directory
config_dir: /mtDNA_variant_call_pipeline/config #absolute path for config directory
results_dir: /mtDNA_variant_call_pipeline/output #absolute path to the results directory
input_dir: /mtDNA_variant_call_pipeline/input #absolute path for input directory

#Variable to hold Sample IDs
SAMPLE_ID: "" #Input Sample ID for pipeline

#List of samples (in tsv format)
units: /mtDNA_variant_call_pipeline/config/samples.txt #Provide local path to where the "units" file is stored containing sample IDs and input ids

#Mitochondrial reference sequence directory
chrM_refseq: /mtDNA_variant_call_pipeline/chrM_reference

#Select whether the input read files are in .bam or .cram format
read_format: "cram"  #include either "cram" or "bam" in quotes

#True/False parameter to handle input file requirements on All of Us' Researcher Workbench
#Default = False
aou_mode: False

